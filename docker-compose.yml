services:
  traefik:
    image: traefik:v3.3
    command:
      - --api.dashboard=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.web.address=:80
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik.rule=Host(`traefik.localhost`)
      - traefik.http.routers.traefik.service=api@internal
    networks:
      - edge

  admin-app:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        uid: ${UID:-1000}
        user: ${USER:-laravel-user}
    working_dir: /var/www
    volumes:
      - ./admin/src:/var/www
      - ./admin/docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token-change-me}
      AGENT_URL: ${AGENT_URL:-http://agent.localhost}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - edge

  admin-nginx:
    image: nginx:alpine
    volumes:
      - ./admin/src:/var/www
      - ./admin/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - admin-app
    labels:
      - traefik.enable=true
      - traefik.http.routers.admin.rule=Host(`${ADMIN_HOST:-admin.localhost}`)
      - traefik.http.routers.admin.entrypoints=web
      - traefik.http.services.admin.loadbalancer.server.port=80
    networks:
      - edge

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    environment:
      APP_ENV: local
      SKIP_BILLING: "false"
      SAMPLE_ROOT: /app/samples/office
      CORS_ORIGINS: ${CORS_ORIGINS:-http://admin.localhost}
      INTERNAL_API_BASE_URL: http://admin-nginx
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token-change-me}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-localpassword}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-gpt-4o}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-10-21}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;}
      AZURE_BLOB_CONTAINER: corpus
      AZURE_INGEST_QUEUE: ingest
      AZURE_SERVICEBUS_CONNECTION_STRING: ${AZURE_SERVICEBUS_CONNECTION_STRING:-}
      AZURE_SERVICEBUS_QUEUE: ingest
      INGEST_APPLY_INLINE: "true"
    volumes:
      - ./agent:/app
    depends_on:
      neo4j:
        condition: service_healthy
      admin-nginx:
        condition: service_started
      azurite:
        condition: service_started
    labels:
      - traefik.enable=true
      - traefik.http.routers.agent.rule=Host(`${AGENT_HOST:-agent.localhost}`)
      - traefik.http.routers.agent.entrypoints=web
      - traefik.http.services.agent.loadbalancer.server.port=8000
    networks:
      - edge

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-closed_agent}
      POSTGRES_USER: ${DB_USERNAME:-laravel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-laravel}"]
      interval: 5s
      timeout: 5s
      retries: 8
    networks:
      - edge

  redis:
    image: redis:alpine
    networks:
      - edge

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-localpassword}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j-data:/data
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-localpassword} 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - edge

  mailpit:
    image: axllent/mailpit:v1.30
    ports:
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - edge

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.34.0
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck --location /data --loose
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite-data:/data
    networks:
      - edge

  mssql:
    profiles: ["emulators"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA:-Y}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-ClosedAgent_Dev1!}
    networks:
      - edge

  servicebus-emulator:
    profiles: ["emulators"]
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    volumes:
      - ./docker/servicebus/config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    ports:
      - "5672:5672"
      - "5300:5300"
    environment:
      SQL_SERVER: mssql
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-ClosedAgent_Dev1!}
      ACCEPT_EULA: ${ACCEPT_EULA:-Y}
      EMULATOR_HTTP_PORT: 5300
    depends_on:
      - mssql
    networks:
      - edge

networks:
  edge:
    driver: bridge

volumes:
  postgres-data:
  neo4j-data:
  azurite-data:
