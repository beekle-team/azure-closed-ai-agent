[project]
name = "closed-agent"
version = "0.1.0"
description = "Closed-network AI agent runtime for Azure"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.28",
  "neo4j>=5.27",
  "openai>=1.60",
  "pydantic-settings>=2.7",
  "azure-storage-blob>=12.24",
  "azure-storage-queue>=12.12",
  "azure-servicebus>=7.13",
  "PyJWT[crypto]>=2.10",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
