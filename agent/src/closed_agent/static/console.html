<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>閉域AIエージェント</title>
  <style>
    :root {
      --bg: #12141a;
      --panel: #1b1f29;
      --ink: #eef1f6;
      --muted: #9aa3b5;
      --line: #2a3140;
      --accent: #d7a14d;
      --ok: #7dcea0;
      --bad: #e07a7a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 16px 24px;
      border-bottom: 1px solid var(--line);
    }
    header strong { color: var(--accent); font-weight: 600; }
    header span { color: var(--muted); font-size: 13px; }
    .who { display: flex; gap: 8px; align-items: center; }
    .who input { width: 220px; }
    nav { display: flex; gap: 8px; padding: 12px 24px; }
    nav button {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
      padding: 8px 14px;
      border-radius: 999px;
      cursor: pointer;
    }
    nav button.active { color: var(--ink); border-color: var(--accent); }
    main { padding: 0 24px 32px; }
    .grid { display: grid; grid-template-columns: 280px 1fr; gap: 16px; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
    .log { min-height: 420px; max-height: 560px; overflow: auto; }
    .msg { margin: 0 0 14px; }
    .msg small { color: var(--muted); }
    .msg p { margin: 4px 0 0; white-space: pre-wrap; line-height: 1.6; }
    form.row { display: flex; gap: 8px; margin-top: 12px; }
    input, textarea, select {
      width: 100%;
      background: #12141a;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
    }
    button.go {
      background: var(--accent);
      color: #1b1408;
      border: 0;
      border-radius: 8px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: 600;
    }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 500; }
    .chip { display: inline-block; padding: 2px 8px; border-radius: 999px; background: #2a3140; color: var(--ok); font-size: 12px; }
    .chip.bad { color: var(--bad); }
    .starter { display: block; width: 100%; text-align: left; margin: 0 0 8px; background: #12141a; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px; cursor: pointer; }
    .hidden { display: none; }
    label { display: block; color: var(--muted); font-size: 12px; margin: 10px 0 4px; }
  </style>
</head>
<body>
  <header>
    <div>
      <strong>閉域AIエージェント</strong>
      <span id="status">接続確認中</span>
      <div id="me" style="color:var(--muted);font-size:13px;margin-top:4px">トークンを入れて身元を開く</div>
    </div>
    <div class="who">
      <input id="token" placeholder="local-admin / local-sales / local-hr" />
      <button class="go" type="button" id="save-token">身元を開く</button>
    </div>
  </header>
  <nav>
    <button class="active" data-tab="chat">チャット</button>
    <button data-tab="knowledge">ナレッジ</button>
    <button data-tab="mail">メール</button>
    <button data-tab="approvals">承認</button>
    <button data-tab="audit">監査</button>
  </nav>
  <main>
    <section id="chat">
      <div class="grid">
        <aside class="panel">
          <p class="chip">入口: ブラウザ</p>
          <p style="color:var(--muted);font-size:13px">見える根拠は、開いた身元の部署と機密区分だけ。</p>
          <div id="starters"></div>
        </aside>
        <div class="panel">
          <div class="log" id="log"></div>
          <form class="row" id="chat-form">
            <input id="question" placeholder="業務の聞き方で投げる" />
            <button class="go" type="submit">送る</button>
          </form>
        </div>
      </div>
    </section>
    <section id="knowledge" class="hidden">
      <div class="panel" style="margin-bottom:16px">
        <button class="go" id="reload-ms" type="button">Microsoft 文書を取り込む</button>
        <span id="ms-result" style="margin-left:12px;color:var(--muted)"></span>
      </div>
      <div class="grid">
        <form class="panel" id="ingest-form">
          <label>題</label>
          <input name="title" required placeholder="口伝の題" />
          <label>本文</label>
          <textarea name="body" rows="8" required placeholder="現場の正本。契約書本文や与信点は置かない。"></textarea>
          <label>系統</label>
          <select name="kind">
            <option value="tacit">口伝</option>
            <option value="manual">規程 / マニュアル</option>
          </select>
          <label>出所</label>
          <select name="source_system">
            <option value="corpus">手元</option>
            <option value="sharepoint">SharePoint</option>
            <option value="teams">Teams</option>
            <option value="outlook">Outlook</option>
            <option value="onedrive">OneDrive</option>
          </select>
          <div style="margin-top:12px"><button class="go" type="submit">文書庫へ置く</button></div>
        </form>
        <div class="panel">
          <table>
            <thead><tr><th>出所</th><th>部署</th><th>区分</th><th>名前</th><th>抜粋</th></tr></thead>
            <tbody id="knowledge-body"></tbody>
          </table>
        </div>
      </div>
    </section>
    <section id="mail" class="hidden">
      <div class="grid">
        <form class="panel" id="mail-form">
          <label>差出人</label>
          <input name="sender" id="mail-sender" value="" readonly />
          <label>件名</label>
          <input name="subject" required placeholder="口伝: 経理の締日 / 質問" />
          <label>本文</label>
          <textarea name="body" rows="8" required></textarea>
          <p style="color:var(--muted);font-size:13px">差出人は開いた身元。未知のメールは受けない。件名が「口伝」で始まると取り込み。</p>
          <button class="go" type="submit">メールとして流す</button>
        </form>
        <div class="panel">
          <h3 style="margin-top:0">出したメール</h3>
          <div id="outbox"></div>
          <h3>Mailpit 受信</h3>
          <div id="inbox"></div>
        </div>
      </div>
    </section>
    <section id="approvals" class="hidden">
      <div class="panel">
        <table>
          <thead><tr><th>状態</th><th>部署</th><th>質問</th><th></th></tr></thead>
          <tbody id="approval-body"></tbody>
        </table>
      </div>
    </section>
    <section id="audit" class="hidden">
      <div class="panel">
        <p id="audit-intact" class="chip">監査チェーン</p>
        <table>
          <thead><tr><th>時刻</th><th>行為</th><th>人</th><th>結果</th><th>対象</th></tr></thead>
          <tbody id="audit-body"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script>
    const starters = [
      "海外出張の申請、画面に出てこない確認事項は？",
      "SharePoint のリンクを顧客メールに貼ってよいか",
      "初めての取引先の与信ルートは？",
      "Teams に貼ったファイルの正本はどこか",
      "該非判定書を再輸出先に渡してよいか",
    ];
    const log = document.getElementById("log");
    const startersEl = document.getElementById("starters");
    starters.forEach((text) => {
      const button = document.createElement("button");
      button.className = "starter";
      button.textContent = text;
      button.onclick = () => ask(text);
      startersEl.appendChild(button);
    });

    function token() {
      return document.getElementById("token").value.trim() || localStorage.getItem("agentToken") || "";
    }
    function headers(extra) {
      const h = Object.assign({ "Content-Type": "application/json" }, extra || {});
      const value = token();
      if (value) h.Authorization = "Bearer " + value;
      return h;
    }
    async function api(path, options) {
      const response = await fetch(path, options);
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) {
        const detail = payload.detail || response.statusText;
        throw new Error(typeof detail === "string" ? detail : JSON.stringify(detail));
      }
      return payload;
    }

    document.querySelectorAll("nav button").forEach((button) => {
      button.onclick = () => {
        document.querySelectorAll("nav button").forEach((b) => b.classList.remove("active"));
        button.classList.add("active");
        ["chat", "knowledge", "mail", "approvals", "audit"].forEach((id) => {
          document.getElementById(id).classList.toggle("hidden", id !== button.dataset.tab);
        });
        if (button.dataset.tab === "knowledge") loadKnowledge();
        if (button.dataset.tab === "mail") loadMail();
        if (button.dataset.tab === "approvals") loadApprovals();
        if (button.dataset.tab === "audit") loadAudit();
      };
    });

    async function health() {
      const payload = await (await fetch("/health")).json();
      document.getElementById("status").textContent =
        `${payload.llm} / ${payload.store} / 認証 ${payload.auth} / ナレッジ ${payload.knowledge} 件`;
    }

    async function whoami() {
      try {
        const me = await api("/v1/me", { headers: headers() });
        document.getElementById("me").textContent =
          `${me.name} / ${me.department} / ${me.clearance}` + (me.can_approve ? " / 承認可" : "");
        document.getElementById("mail-sender").value = me.email;
      } catch (error) {
        document.getElementById("me").textContent = error.message;
      }
    }

    function addMsg(role, text, meta) {
      const wrap = document.createElement("div");
      wrap.className = "msg";
      wrap.innerHTML = `<small>${role}</small><p></p>`;
      wrap.querySelector("p").textContent = text + (meta ? `\n${meta}` : "");
      log.appendChild(wrap);
      log.scrollTop = log.scrollHeight;
    }

    async function ask(text) {
      addMsg("あなた", text);
      try {
        const payload = await api("/v1/chat", {
          method: "POST",
          headers: headers(),
          body: JSON.stringify({ question: text }),
        });
        const cites = (payload.citations || []).map((c) => `${c.source}:${c.name}`).join(" · ");
        addMsg("社内AI", payload.answer, [payload.status, payload.intent, payload.approval_id, cites].filter(Boolean).join(" | "));
        if (payload.status === "needs_approval") loadApprovals();
      } catch (error) {
        addMsg("社内AI", error.message, "error");
      }
    }

    document.getElementById("chat-form").onsubmit = (event) => {
      event.preventDefault();
      const input = document.getElementById("question");
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      ask(text);
    };

    document.getElementById("save-token").onclick = () => {
      localStorage.setItem("agentToken", token());
      whoami();
    };
    document.getElementById("token").value = localStorage.getItem("agentToken") || "local-admin";

    async function loadKnowledge() {
      try {
        const items = await api("/v1/knowledge", { headers: headers() });
        document.getElementById("knowledge-body").innerHTML = items.map((item) =>
          `<tr><td class="chip">${item.source_system}</td><td>${item.department || ""}</td><td>${item.classification || ""}</td><td>${item.name}</td><td>${item.excerpt}</td></tr>`
        ).join("");
      } catch (error) {
        document.getElementById("knowledge-body").innerHTML = `<tr><td colspan="5">${error.message}</td></tr>`;
      }
    }

    document.getElementById("ingest-form").onsubmit = async (event) => {
      event.preventDefault();
      const data = Object.fromEntries(new FormData(event.target));
      try {
        await api("/v1/ingest", {
          method: "POST",
          headers: headers(),
          body: JSON.stringify({
            path: data.title + ".md",
            title: data.title,
            body: data.body,
            kind: data.kind,
            source_system: data.source_system,
          }),
        });
        event.target.reset();
        loadKnowledge();
        health();
      } catch (error) {
        addMsg("取り込み", error.message, "error");
      }
    };

    document.getElementById("reload-ms").onclick = async () => {
      try {
        const payload = await api("/v1/ingest/microsoft", { method: "POST", headers: headers() });
        document.getElementById("ms-result").textContent = `${payload.mode} / ${payload.count} 件`;
        loadKnowledge();
        health();
      } catch (error) {
        document.getElementById("ms-result").textContent = error.message;
      }
    };

    document.getElementById("mail-form").onsubmit = async (event) => {
      event.preventDefault();
      const data = Object.fromEntries(new FormData(event.target));
      try {
        const payload = await api("/v1/mail/send", {
          method: "POST",
          headers: headers(),
          body: JSON.stringify(data),
        });
        addMail("outbox", `${payload.would_send}\n${payload.text}`);
        loadMail();
      } catch (error) {
        addMail("outbox", error.message);
      }
    };

    function addMail(id, text) {
      document.getElementById(id).textContent = text;
    }

    async function loadMail() {
      try {
        const out = await api("/v1/mail/outbox", { headers: headers() });
        document.getElementById("outbox").innerHTML = out.map((m) =>
          `<p><small>${m.via} ${m.to}</small><br>${m.subject}</p>`
        ).join("") || "<p>まだ無い</p>";
        const inbox = await api("/v1/mail/inbox", { headers: headers() });
        document.getElementById("inbox").innerHTML = inbox.map((m) =>
          `<p><small>${m.from}</small><br>${m.subject}</p>`
        ).join("") || "<p>Mailpit にまだ無い</p>";
      } catch (error) {
        document.getElementById("outbox").textContent = error.message;
      }
    }

    async function loadApprovals() {
      try {
        const items = await api("/v1/approvals", { headers: headers() });
        document.getElementById("approval-body").innerHTML = items.map((item) =>
          `<tr><td>${item.status}</td><td>${item.department}</td><td>${item.question}</td><td>${
            item.status === "pending"
              ? `<button class="go" data-approve="${item.id}">通す</button>`
              : ""
          }</td></tr>`
        ).join("") || "<tr><td colspan='4'>待ちは無い</td></tr>";
        document.querySelectorAll("[data-approve]").forEach((button) => {
          button.onclick = async () => {
            try {
              await api("/v1/approvals/" + button.dataset.approve, {
                method: "POST",
                headers: headers(),
                body: JSON.stringify({ approved: true }),
              });
              loadApprovals();
            } catch (error) {
              addMsg("承認", error.message, "error");
            }
          };
        });
      } catch (error) {
        document.getElementById("approval-body").innerHTML = `<tr><td colspan="4">${error.message}</td></tr>`;
      }
    }

    async function loadAudit() {
      try {
        const payload = await api("/v1/audit", { headers: headers() });
        const intact = document.getElementById("audit-intact");
        intact.textContent = payload.intact ? "ハッシュ連鎖は壊れていない" : "監査ログが改ざんされている";
        intact.classList.toggle("bad", !payload.intact);
        document.getElementById("audit-body").innerHTML = (payload.events || []).slice().reverse().map((item) =>
          `<tr><td>${item.ts}</td><td>${item.action}</td><td>${item.actor}</td><td>${item.outcome}</td><td>${item.resource}</td></tr>`
        ).join("");
      } catch (error) {
        document.getElementById("audit-body").innerHTML = `<tr><td colspan="5">${error.message}</td></tr>`;
      }
    }

    health();
    whoami();
  </script>
</body>
</html>
